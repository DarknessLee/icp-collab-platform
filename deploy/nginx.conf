# Nginx for the ICP platform SPA (mounted at /etc/nginx/conf.d/default.conf).
# - serves the built Vite dist with history fallback
# - proxies /api/ to the backend service (Spring Boot listens on 8080)
# - gzip + long cache for hashed assets, 25m upload limit
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff font/woff2;

    # API reverse proxy (URI is passed through unchanged: /api/v1/... -> backend:8080/api/v1/...)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health endpoints (optional direct access for compose probes)
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Do not cache the entry html.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
