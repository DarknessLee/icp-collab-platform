server:
  # M4: overridable in containers, default keeps the local 8080 behaviour
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    # Comma separated allowed origins; defaults cover Vite dev (5173) and preview (4173).
    # M4: override with CORS_ORIGINS in containers behind Nginx.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

spring:
  application:
    name: icp-platform-backend
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # M4: container-friendly datasource placeholders. The local profile
  # (application-local.yml) keeps its exact 127.0.0.1:3307 values, so the
  # default local behaviour is unchanged.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/icp_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:icp_app}
    password: ${DB_PASSWORD:Icp@2026}

flowable:
  database-schema-update: true
  history-level: full
  async-executor-activate: false
  # M2c: WorkflowDefinitionService 统一部署(deployment name=icp-processes)，关闭自动部署避免重复版本
  check-process-definitions: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

icp:
  jwt:
    # M4: override JWT_SECRET in deployments (must stay a base64 HMAC key).
    secret: ${JWT_SECRET:aWNwLXBsYXRmb3JtLWRlbW8tc2VjcmV0LWtleS0yMDI2LXNwcmluZy1ib290LWp3dC1oczI1Ng==}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
    issuer: icp-platform
  auth:
    max-fail-count: 5
    lock-minutes: 15
  storage:
    # Relative to the backend working directory; compose maps a persistent volume.
    local-root: ${STORAGE_ROOT:../.runtime/files}

logging:
  level:
    root: INFO
    com.icp: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
